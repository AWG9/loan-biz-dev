{% extends "base.html" %}
{% block title %}Add Contact{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
  <h4 class="fw-bold mb-0">Add Contact</h4>
  <a href="/contacts" class="btn btn-outline-secondary btn-sm ms-auto">← Back</a>
</div>
<div class="card" style="max-width:560px;">
  <div class="card-body">
    <form action="/contacts/add" method="post">
      <div class="mb-3"><label class="form-label">Full Name *</label><input type="text" name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Company</label><input type="text" name="company" class="form-control"></div>
      <div class="row">
        <div class="col mb-3"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control"></div>
        <div class="col mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
      </div>
      <div class="mb-3"><label class="form-label">Industry</label><input type="text" name="industry" class="form-control" placeholder="e.g. Restaurant, Retail, Construction"></div>
      <div class="mb-3"><label class="form-label">Previous Loan Amount ($)</label><input type="number" name="prev_loan_amount" class="form-control" value="0" step="1000"></div>
      <div class="mb-3"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="3"></textarea></div>
      <button class="btn btn-primary w-100">Add Contact</button>
    </form>
  </div>
</div>
{% endblock %}
